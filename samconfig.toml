# SAM deployment config for HiveOS.
#
# Contains no secrets — stack name, region and build flags only. Credentials
# come from the ambient AWS profile, never from this file. If a secret ever
# needs to reach a Lambda, it goes in SSM Parameter Store, not here.
#
#   sam build --use-container    # local Python is 3.14; the container image is not
#   sam deploy

version = 0.1

[default.build.parameters]
use_container = true

[default.validate.parameters]
lint = true

[default.deploy.parameters]
stack_name = "hiveos"
region = "us-east-1"
capabilities = "CAPABILITY_IAM"
resolve_s3 = true
confirm_changeset = false
fail_on_empty_changeset = false
# Pinned here, not left to the template Default, because CloudFormation keeps a
# deployed stack's existing parameter values on update — editing a `Default:`
# changes nothing about a stack that already exists. The model name is not a
# secret; the API key is a SecureString in SSM and is never passed as a
# parameter. GroqKeyParam is the parameter *name* only.
parameter_overrides = "GroqModel=openai/gpt-oss-120b GroqKeyParam=/hiveos/groq-api-key MaxTokensPerCall=400"
