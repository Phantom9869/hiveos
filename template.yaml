AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Description: >
  HiveOS — OS-style scheduler for a team's shared AI agent budget.
  All stack resources live here. Never create them with one-off CLI commands:
  CloudFormation owns the inventory, which is what prevents duplicate
  infrastructure across sessions. See ARCHITECTURE.md decision 10.

# ---------------------------------------------------------------------------
# Resources are added incrementally:
#   Phase 0  -> DynamoDB table                              DEPLOYED
#   Phase 1  -> WebSocket API, Router Lambda                DEPLOYED
#   Phase 2  -> SQS queue + DLQ, Agent Runner Lambda            DEPLOYED
#   Phase 3  -> Bedrock IAM permissions on the Agent Runner
# Sections below are marked with the phase that fills them in.
# ---------------------------------------------------------------------------

Parameters:
  StageName:
    Type: String
    Default: prod
    Description: WebSocket API stage. Part of the public wss:// URL.

  TokenBudget:
    Type: Number
    Default: 1000000
    Description: Team token ceiling. Enforced server-side by the Agent Runner.

  MaxTokensPerCall:
    Type: Number
    Default: 1024
    Description: Per-invocation output cap. Keeps a runaway loop cheap.

Globals:
  Function:
    Runtime: python3.13
    Architectures:
      - arm64            # cheaper, faster, builds natively under --use-container on Apple Silicon
    Timeout: 30
    MemorySize: 512
    Environment:
      Variables:
        TABLE_NAME: !Ref StateTable
        TEAM_ID: alpha

Resources:

  # -------------------------------------------------------------------------
  # PHASE 0 — State
  # Single table, PK/SK pattern. Schema in CONTRACT.md.
  # -------------------------------------------------------------------------
  StateTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: hiveos-state
      BillingMode: PAY_PER_REQUEST      # scales to zero; no idle cost
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE

  # -------------------------------------------------------------------------
  # PHASE 1 — WebSocket API + Router Lambda
  #
  # SAM has no first-class WebSocket resource, so these are raw
  # AWS::ApiGatewayV2::* resources (a SAM template is a CloudFormation
  # superset, so this is supported).
  # -------------------------------------------------------------------------

  WebSocketApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: hiveos-ws
      ProtocolType: WEBSOCKET
      # Only $default is declared below, so every action lands in one handler.
      # Adding a client action in a later phase is a code change, not an
      # infrastructure change.
      RouteSelectionExpression: $request.body.action

  RouterFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: hiveos-router
      CodeUri: backend/            # whole backend/ is packaged so `shared` imports work
      Handler: router.app.lambda_handler
      Environment:
        Variables:
          WS_ENDPOINT: !Sub 'https://${WebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/${StageName}'
          QUEUE_URL: !Ref TaskQueue
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref StateTable
        - SQSSendMessagePolicy:
            QueueName: !GetAtt TaskQueue.QueueName
        # Without this every post_to_connection fails 403 AccessDeniedException.
        - Statement:
            - Effect: Allow
              Action: execute-api:ManageConnections
              Resource: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*'

  RouterInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref RouterFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*/*'

  WebSocketIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${RouterFunction.Arn}/invocations'

  ConnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: $connect
      AuthorizationType: NONE
      Target: !Sub 'integrations/${WebSocketIntegration}'

  DisconnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: $disconnect
      AuthorizationType: NONE
      Target: !Sub 'integrations/${WebSocketIntegration}'

  DefaultRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: $default
      AuthorizationType: NONE
      Target: !Sub 'integrations/${WebSocketIntegration}'

  # A Deployment is an immutable snapshot of the route table. Lambda code
  # changes do not need a new one (the integration URI is unchanged), but
  # adding or removing a route does — and CloudFormation will not recreate
  # this resource in place. If a route is ever added, rename this logical ID
  # (e.g. WebSocketDeploymentV2) in the same commit.
  WebSocketDeployment:
    Type: AWS::ApiGatewayV2::Deployment
    DependsOn:
      - ConnectRoute
      - DisconnectRoute
      - DefaultRoute
    Properties:
      ApiId: !Ref WebSocketApi

  WebSocketStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref WebSocketApi
      StageName: !Ref StageName
      DeploymentId: !Ref WebSocketDeployment

  # -------------------------------------------------------------------------
  # PHASE 2 — SQS queue + DLQ, Agent Runner Lambda
  #
  # Queue carries every agent task (see ARCHITECTURE.md decision 1 for why
  # waiting tasks live in DynamoDB, not in SQS).
  # Set a generous maxReceiveCount so a transient failure does not
  # dead-letter a demo task.
  # Agent Runner timeout must exceed the slowest expected Bedrock call.
  # -------------------------------------------------------------------------

  TaskQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: hiveos-agent-tasks
      # Must be >= the Agent Runner timeout or SQS redelivers a task that is
      # still running. AWS recommends 6x the function timeout (60s).
      VisibilityTimeout: 360
      MessageRetentionPeriod: 3600
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt TaskDLQ.Arn
        # Generous: a transient DynamoDB or API Gateway blip must not
        # dead-letter a task mid-demo.
        maxReceiveCount: 5

  TaskDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: hiveos-agent-tasks-dlq
      MessageRetentionPeriod: 1209600   # 14 days — the post-mortem record

  AgentRunnerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: hiveos-agent-runner
      CodeUri: backend/            # same package as the Router so `shared` imports work
      Handler: agent_runner.app.lambda_handler
      # Phase 2 runs a stub agent in ~5s. Sized now for the Phase 3 Bedrock
      # call so the queue's VisibilityTimeout does not have to change later.
      Timeout: 60
      Environment:
        Variables:
          WS_ENDPOINT: !Sub 'https://${WebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/${StageName}'
          # The runner dispatches the next queued task itself, so it both
          # consumes from and produces to the same queue.
          QUEUE_URL: !Ref TaskQueue
          TOKEN_BUDGET: !Ref TokenBudget
          MAX_TOKENS_PER_CALL: !Ref MaxTokensPerCall
      Events:
        Tasks:
          Type: SQS
          Properties:
            Queue: !GetAtt TaskQueue.Arn
            # One message per invocation: one task holds exactly one slot.
            BatchSize: 1
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref StateTable
        - SQSSendMessagePolicy:
            QueueName: !GetAtt TaskQueue.QueueName
        - Statement:
            - Effect: Allow
              Action: execute-api:ManageConnections
              Resource: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*'

  # -------------------------------------------------------------------------
  # PHASE 3 — Bedrock permissions
  #
  # bedrock:InvokeModel (and InvokeModelWithResponseStream if streaming)
  # on the Agent Runner role, scoped to the resolved model / inference
  # profile ARN recorded in CONTRACT.md.
  # -------------------------------------------------------------------------

Outputs:
  TableName:
    Description: DynamoDB single-table store
    Value: !Ref StateTable
    Export:
      Name: !Sub '${AWS::StackName}-TableName'

  TokenBudget:
    Description: Configured team token ceiling
    Value: !Ref TokenBudget

  WebSocketURL:
    Description: wss:// endpoint the frontend connects to
    Value: !Sub 'wss://${WebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/${StageName}'
    Export:
      Name: !Sub '${AWS::StackName}-WebSocketURL'

  WebSocketMgmt:
    Description: https:// management endpoint used by post_to_connection
    Value: !Sub 'https://${WebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/${StageName}'

  RouterFunctionName:
    Description: Router Lambda, for sam logs
    Value: !Ref RouterFunction

  QueueUrl:
    Description: SQS queue every agent task is dispatched through
    Value: !Ref TaskQueue
    Export:
      Name: !Sub '${AWS::StackName}-QueueUrl'

  DeadLetterQueueUrl:
    Description: Dead-letter queue — inspect this when a task vanishes
    Value: !Ref TaskDLQ

  AgentRunnerFunctionName:
    Description: Agent Runner Lambda, for sam logs
    Value: !Ref AgentRunnerFunction
